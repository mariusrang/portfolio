<style>
  :root {
    --bg:#f9f9fa; --fg:#141518; --muted:#62656d; --soft:#8b8e96; --line:#dfe0e4;
    --chip:#eeeff2; --card:#ffffff; --accent:#4757e6; --shadow:0 1px 2px rgba(20,21,24,.08);
    --display:"Space Grotesk", system-ui, sans-serif; --body:"DM Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1012; --fg:#ecedf0; --muted:#a2a5ad; --soft:#7d8089; --line:#26282d;
      --chip:#1c1e22; --card:#16171a; --accent:#8390ff; --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1012; --fg:#ecedf0; --muted:#a2a5ad; --soft:#7d8089; --line:#26282d;
    --chip:#1c1e22; --card:#16171a; --accent:#8390ff; --shadow:0 1px 2px rgba(0,0,0,.4);
  }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 var(--body); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; }
  .wrap { max-width:1040px; margin:0 auto; padding:0 40px; }
  svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* ---------- header ---------- */
  .top { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:30px 0 26px; border-bottom:1px solid var(--line); }
  .brand { font:600 23px/1 var(--display); letter-spacing:-.01em; }
  .brand span { color:var(--accent); }
  .nav { display:flex; align-items:center; gap:34px; margin-left:auto; margin-right:8px; }
  .nav a.tab { position:relative; color:var(--muted); font-size:15.5px; padding:4px 0; transition:color .15s; }
  .nav a.tab:hover, .nav a.tab.on { color:var(--fg); }
  .nav a.tab.on::after { content:""; position:absolute; left:0; bottom:-9px; width:16px; height:2px; background:var(--accent); border-radius:2px; }
  .actions { display:flex; align-items:center; gap:10px; }
  .lang { display:flex; padding:3px; border:1px solid var(--line); border-radius:7px; background:var(--card); }
  .lang button { border:0; background:transparent; padding:4px 8px; border-radius:5px; font-size:12.5px; font-weight:500; letter-spacing:.04em; color:var(--soft); cursor:pointer; }
  .lang button[aria-pressed="true"] { background:var(--chip); color:var(--fg); }
  .btn { display:inline-flex; align-items:center; gap:10px; padding:8px 12px 8px 13px; border:1px solid var(--line); border-radius:6px; background:var(--card); box-shadow:var(--shadow); font-size:14.5px; font-weight:500; cursor:pointer; transition:border-color .15s, transform .15s; white-space:nowrap; }
  .btn:hover { border-color:var(--soft); }
  .btn:active { transform:translateY(1px); }
  .btn.ghost { color:var(--soft); box-shadow:none; background:transparent; cursor:default; }

  /* ---------- sub bar ---------- */
  .sub { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 0; }
  .crumb { display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--muted); min-height:32px; }
  .crumb a:hover b { background:var(--line); }
  .crumb b { font-weight:500; color:var(--fg); background:var(--chip); padding:6px 12px; border-radius:6px; }
  .sub .right { display:flex; align-items:center; gap:14px; color:var(--muted); font-size:13.5px; }
  .icon-btn { border:0; background:transparent; padding:6px; border-radius:6px; cursor:pointer; color:var(--muted); display:grid; place-items:center; }
  .icon-btn:hover { background:var(--chip); color:var(--fg); }
  .icon-btn .sun { display:none; }
  :root[data-theme="dark"] .icon-btn .sun { display:block; } :root[data-theme="dark"] .icon-btn .moon { display:none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .icon-btn .sun { display:block; } :root:not([data-theme="light"]) .icon-btn .moon { display:none; } }

  /* ---------- pages ---------- */
  .page { display:none; padding:56px 0 40px; }
  .page.on { display:block; animation:fade .45s ease both; }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .kicker { display:flex; align-items:center; gap:10px; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0; }
  .kicker::before { content:""; width:7px; height:7px; background:var(--accent); flex:none; }
  .hero h1 { font:500 clamp(40px, 6.6vw, 66px)/1.05 var(--display); letter-spacing:-.025em; margin:22px 0 26px; }
  .hero p.intro { font-size:17.5px; line-height:1.75; color:var(--muted); max-width:620px; margin:0; }

  /* ---------- projects ---------- */
  .proj .media { position:relative; display:block; overflow:hidden; border-radius:6px; background:var(--chip); }
  .proj .media svg.cover, .proj .media img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center; display:block; transition:transform .6s cubic-bezier(.2,.7,.2,1); }
  .proj:hover .media svg.cover, .proj:hover .media img { transform:scale(1.03); }
  .proj .num { position:absolute; top:14px; left:14px; z-index:1; font-size:12.5px; color:#5d6068; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .meta b { font-weight:400; }
  .flag { color:var(--accent); border:1px solid currentColor; border-radius:4px; padding:0 6px; letter-spacing:.08em; font-size:11px; line-height:18px; }
  .proj h3 { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; font:500 25px/1.25 var(--display); letter-spacing:-.01em; margin:12px 0 12px; }
  .proj h3 .i { width:17px; height:17px; margin-top:5px; transition:transform .2s; }
  .proj:hover h3 .i { transform:translate(2px,-2px); }
  .proj p { margin:0 0 16px; color:var(--muted); font-size:15.5px; line-height:1.65; max-width:680px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tags span { font-size:12.5px; padding:4px 10px; background:var(--chip); border-radius:4px; color:var(--muted); }
  .plinks { display:flex; flex-wrap:wrap; gap:18px; margin-top:16px; font-size:14px; font-weight:500; }
  .plinks a { display:inline-flex; align-items:center; gap:5px; border-bottom:1px solid var(--line); padding-bottom:1px; }
  .plinks a:hover { border-color:var(--fg); }
  .plinks .i { width:14px; height:14px; }

  .projects.editorial { display:grid; grid-template-columns:1fr 1fr; gap:56px 28px; margin-top:56px; }
  .projects.editorial .media { aspect-ratio:1.25; }
  .projects.editorial .body { padding-top:22px; }



  /* ---------- home intro ---------- */
  .me { display:flex; align-items:center; gap:16px; }
  .me img { width:64px; height:64px; border-radius:50%; object-fit:cover; flex:none; border:1px solid var(--line); }
  .me .kicker { margin:0; }
  .now { display:flex; flex-wrap:wrap; gap:8px 10px; margin:26px 0 0; padding:0; list-style:none; }
  .now li { font-size:13.5px; color:var(--fg); background:var(--chip); border-radius:999px; padding:6px 13px; }
  .now li:first-child::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:#22b573; margin-right:8px; vertical-align:1px; }
  .hl { display:grid; grid-template-columns:repeat(4, 1fr); margin-top:44px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .hl div { padding:22px 20px 22px 0; }
  .hl div + div { padding-left:20px; border-left:1px solid var(--line); }
  .hl b { display:block; font:500 26px/1.15 var(--display); letter-spacing:-.01em; color:var(--accent); }
  .hl span { display:block; margin-top:6px; font-size:13.5px; color:var(--muted); line-height:1.5; }
  .metric { color:var(--accent); border:1px solid currentColor; border-radius:4px; padding:0 6px; letter-spacing:.08em; font-size:11px; line-height:18px; }
  .readmore { display:inline-flex; align-items:center; gap:6px; margin-top:16px; font-size:14px; font-weight:500; border-bottom:1px solid var(--fg); padding-bottom:1px; }
  .readmore .i { width:14px; height:14px; }

  /* ---------- project detail ---------- */
  .back { display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); margin-bottom:28px; }
  .back:hover { color:var(--fg); }
  .detail h1 { font:500 clamp(36px, 5.6vw, 58px)/1.08 var(--display); letter-spacing:-.025em; margin:18px 0 18px; }
  .detail .lead { font-size:18px; line-height:1.7; color:var(--muted); max-width:720px; margin:0; }
  .detail .hero-media { margin-top:40px; border-radius:8px; overflow:hidden; background:var(--chip); }
  .detail .hero-media { background:#eaecf1; }
  .detail .hero-media img { display:block; width:100%; height:auto; max-height:560px; object-fit:contain; }
  .detail .hero-media video { display:block; width:100%; height:auto; background:#000; }
  .detail .note { font-size:13.5px; color:var(--muted); margin:12px 0 0; }
  .sec { display:grid; grid-template-columns:188px 1fr; gap:0 40px; padding:30px 0; border-top:1px solid var(--line); }
  .sec:first-of-type { margin-top:48px; }
  .sec .lbl { font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding-top:4px; }
  .sec p { margin:0; font-size:16px; line-height:1.75; max-width:720px; }
  .sec ul { margin:0; padding:0; list-style:none; max-width:720px; }
  .sec li { position:relative; padding-left:20px; margin:0 0 10px; line-height:1.7; }
  .sec li::before { content:""; position:absolute; left:0; top:13px; width:8px; height:1px; background:var(--accent); }
  .chart { margin:4px 0 20px; max-width:620px; }
  .chart .ct { font-size:13.5px; color:var(--muted); margin:0 0 12px; }
  .bar { display:grid; grid-template-columns:130px 1fr 64px; align-items:center; gap:12px; margin:8px 0; font-size:14px; }
  .bar .track { height:12px; background:var(--chip); border-radius:3px; overflow:hidden; }
  .bar .fill { height:100%; background:color-mix(in srgb, var(--accent) 38%, var(--chip)); border-radius:3px; }
  .bar.best .fill { background:var(--accent); }
  .bar .v { font-variant-numeric:tabular-nums; text-align:right; }
  .bar.best .v { color:var(--accent); font-weight:500; }
  .detail .plinks { margin-top:0; }
  .next { display:flex; justify-content:space-between; gap:16px; margin-top:48px; padding-top:24px; border-top:1px solid var(--line); font-size:14px; }
  .next a { color:var(--muted); } .next a:hover { color:var(--fg); }

  /* ---------- background ---------- */
  .block { margin-top:72px; }
  .block h2 { font:500 32px/1.2 var(--display); letter-spacing:-.015em; margin:0; padding-bottom:22px; border-bottom:1px solid var(--line); }
  .block h2 small { font:400 12.5px var(--body); color:var(--muted); margin-left:14px; vertical-align:middle; }
  .row { display:grid; grid-template-columns:188px 1fr; gap:0 40px; padding:34px 0 8px; }
  .row .lbl { font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding-top:6px; }
  .row h3 { font:500 25px/1.3 var(--display); letter-spacing:-.01em; margin:0 0 12px; }
  .row p { margin:0 0 4px; color:var(--muted); font-size:15.5px; line-height:1.7; }
  .row ul { margin:14px 0 0; padding:0; list-style:none; }
  .row li { position:relative; padding-left:20px; margin:0 0 8px; color:var(--muted); font-size:15.5px; line-height:1.65; }
  .row li::before { content:""; position:absolute; left:0; top:12px; width:8px; height:1px; background:var(--soft); }
  .row .tags { margin-top:16px; }
  .row.skill { padding-top:24px; align-items:center; }
  .row.skill .lbl { padding-top:0; }
  .row.skill .tags { margin:0; }
  .logos { display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; margin-bottom:20px; }
  .logos .x { color:var(--soft); font-size:15px; }
  .logo { display:flex; align-items:center; height:62px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .logo img { height:44px; width:auto; max-width:200px; display:block; }
  .logo.dark { background:#000; border-color:#000; padding:8px 16px; }
  .logo.dark img { height:26px; }
  .logo.fallback { background:var(--card); font-size:13px; font-weight:500; gap:10px; padding:8px 14px 8px 8px; }
  .logo.fallback i { width:38px; height:38px; border-radius:6px; display:grid; place-items:center; color:#fff; font:600 12px var(--display); font-style:normal; }
  .cv-cta { margin-top:48px; }
  .cv-cta .btn { font-size:16px; padding:11px 16px 11px 17px; }

  /* ---------- links ---------- */
  .links { margin-top:44px; border-top:1px solid var(--line); }
  .link { display:grid; grid-template-columns:28px 1fr auto; gap:16px 22px; align-items:center; padding:28px 0; border-bottom:1px solid var(--line); }
  .link > .i { width:22px; height:22px; stroke-width:1.6; }
  .link h3 { font:500 25px/1.3 var(--display); letter-spacing:-.01em; margin:0 0 4px; }
  .link p { margin:0; color:var(--muted); font-size:14.5px; }
  .link .btn { font-size:14px; }
  .link .btn .i { width:15px; height:15px; }
  .useful-title { font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:64px 0 0; display:flex; align-items:center; gap:10px; }
  .useful-title::before { content:""; width:7px; height:7px; background:var(--accent); }
  .links.small { margin-top:18px; }
  .links.small h3 { font-size:20px; }
  .links.small .link { padding:20px 0; }

  .toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%, 20px); opacity:0; pointer-events:none; background:var(--fg); color:var(--bg); padding:11px 16px; border-radius:8px; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.18); transition:opacity .2s, transform .2s; z-index:10; max-width:calc(100% - 32px); }
  .toast.on { opacity:1; transform:translate(-50%, 0); }
  .link .btns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

  /* ---------- footer ---------- */
  footer { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px 24px; padding:26px 0 44px; margin-top:64px; border-top:1px solid var(--line); font-size:13.5px; color:var(--muted); }
  footer .r { display:flex; gap:30px; }
  footer .r a { display:inline-flex; align-items:center; gap:6px; color:var(--fg); opacity:.8; }
  footer .r a:hover { opacity:1; }
  footer .r .i { width:14px; height:14px; }
  footer .dot { margin:0 10px; }

  /* ---------- responsive ---------- */
  @media (max-width:860px) {
    .wrap { padding:0 16px; }
    .top { flex-wrap:wrap; padding:22px 0 18px; row-gap:16px; }
    .nav { order:3; width:100%; gap:26px; margin:0; }
    .btn.cv span { display:none; }
    .sub .right .tagline { display:none; }
    .page { padding-top:36px; }
    .projects.editorial { grid-template-columns:1fr; }
    .row { grid-template-columns:1fr; gap:6px; padding-top:26px; }
    .hl { grid-template-columns:1fr 1fr; }
    .hl div:nth-child(3) { padding-left:0; border-left:0; }
    .hl div:nth-child(n+3) { border-top:1px solid var(--line); }
    .sec { grid-template-columns:1fr; gap:10px; }
    .bar { grid-template-columns:96px 1fr 56px; }
    .row.skill { padding-top:20px; }
    .link { grid-template-columns:24px 1fr; }
    .link .btns { grid-column:2; justify-content:flex-start; }
    footer .r { gap:20px; }
  }
  @media (prefers-reduced-motion: reduce) { .page.on { animation:none; } * { transition:none !important; } }
</style>
</head>

  const ic = {

  /* ---------- generated project covers ---------- */
  const rng = seed => { let x = seed * 9301 + 49297; return () => ((x = (x * 9301 + 49297) % 233280) / 233280); };
  const wrapSvg = (bg, inner, defs = "") => `<svg class="cover" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs><rect width="640" height="420" fill="${bg}"/>${inner}</svg>`;

  const covers = {
    network(seed) {
      const r = rng(seed + 3), N = 150, R = 150, cx = 320, cy = 210, pts = [];
      const ga = Math.PI * (3 - Math.sqrt(5)), ax = .5 + r(), ay = .4 + r();
      for (let i = 0; i < N; i++) {
        const y = 1 - (i / (N - 1)) * 2, rad = Math.sqrt(1 - y * y), th = ga * i;
        let x = Math.cos(th) * rad + (r() - .5) * .08, z = Math.sin(th) * rad + (r() - .5) * .08;
        const x1 = x * Math.cos(ay) + z * Math.sin(ay), z1 = -x * Math.sin(ay) + z * Math.cos(ay);
        pts.push([x1, y * Math.cos(ax) - z1 * Math.sin(ax), y * Math.sin(ax) + z1 * Math.cos(ax)]);
      }
      let lines = "", dots = "";
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
        const a = pts[i], b = pts[j];
        if (Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]) < .36)
          lines += `<line x1="${(cx+a[0]*R).toFixed(1)}" y1="${(cy+a[1]*R).toFixed(1)}" x2="${(cx+b[0]*R).toFixed(1)}" y2="${(cy+b[1]*R).toFixed(1)}" stroke-opacity="${(.12+((a[2]+b[2])/2+1)/2*.45).toFixed(2)}"/>`;
      }
      pts.slice().sort((a, b) => a[2] - b[2]).forEach(p => { const d = (p[2] + 1) / 2;
        dots += `<circle cx="${(cx+p[0]*R).toFixed(1)}" cy="${(cy+p[1]*R).toFixed(1)}" r="${(1.2+d*3.4).toFixed(1)}" fill-opacity="${(.35+d*.65).toFixed(2)}"/>`; });
      return wrapSvg(`url(#nb${seed})`, `<g stroke="#3d5ee0" stroke-width=".7">${lines}</g><g fill="url(#nd${seed})">${dots}</g>`,
        `<radialGradient id="nb${seed}" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#f7f8fb"/><stop offset="1" stop-color="#e2e6ee"/></radialGradient><radialGradient id="nd${seed}" cx="35%" cy="30%"><stop offset="0" stop-color="#b8c6ff"/><stop offset="1" stop-color="#2f4fd8"/></radialGradient>`);
    },
    blocks(seed) {
      const s = 28, cx = 290, cy = 238, c30 = Math.cos(Math.PI / 6);
      const P = (x, y, z) => `${(cx + (x - y) * c30 * s).toFixed(1)},${(cy + (x + y) * .5 * s - z * s).toFixed(1)}`;
      const box = (x, y, z, w, d, h, top, left, right, op = 1) => `
        <polygon points="${P(x,y+d,z)} ${P(x+w,y+d,z)} ${P(x+w,y+d,z+h)} ${P(x,y+d,z+h)}" fill="${left}" fill-opacity="${op}"/>
        <polygon points="${P(x+w,y,z)} ${P(x+w,y+d,z)} ${P(x+w,y+d,z+h)} ${P(x+w,y,z+h)}" fill="${right}" fill-opacity="${op}"/>
        <polygon points="${P(x,y,z+h)} ${P(x+w,y,z+h)} ${P(x+w,y+d,z+h)} ${P(x,y+d,z+h)}" fill="${top}" fill-opacity="${op}"/>`;
      const g = ["#f3f3f4", "#c9cacf", "#dedfe3"], [gx, gy] = P(1.5, 1, 4.4).split(",");
      return wrapSvg(`url(#bb${seed})`,
        box(-3,-1,0,3,4,6,...g) + box(0,-1,0,3,4,4.4,...g) + box(3,-1,0,3,4,2.8,...g) + box(6,-1,0,3,4,1.2,...g) +
        `<ellipse cx="${gx}" cy="${gy}" rx="74" ry="28" fill="url(#bg${seed})"/>` +
        box(.6,.1,4.4,1.9,1.9,1.9,"#5d6bff","#1c2bd8","#2e3df0",.93),
        `<linearGradient id="bb${seed}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfd0d4"/><stop offset="1" stop-color="#eeeff1"/></linearGradient><radialGradient id="bg${seed}"><stop offset="0" stop-color="#3b4dff" stop-opacity=".55"/><stop offset="1" stop-color="#3b4dff" stop-opacity="0"/></radialGradient>`);
    },
    orbit(seed) {
      const r = rng(seed + 11); let g = "";
      for (let i = 0; i < 7; i++) {
        const rx = 60 + i * 34, ry = 22 + i * 13, a = r() * Math.PI * 2;
        g += `<ellipse cx="320" cy="210" rx="${rx}" ry="${ry}" transform="rotate(-14 320 210)" fill="none" stroke="#3d5ee0" stroke-opacity="${(.55 - i * .06).toFixed(2)}"/>`;
        g += `<circle cx="${(320 + Math.cos(a) * rx).toFixed(1)}" cy="${(210 + Math.sin(a) * ry).toFixed(1)}" r="${(3 + r() * 4).toFixed(1)}" fill="#2f4fd8"/>`;
      }
      return wrapSvg("#eceef3", `<g transform="rotate(-14 320 210)">${g.replace(/ transform="rotate\(-14 320 210\)"/g, "")}</g><circle cx="320" cy="210" r="26" fill="#2f4fd8"/>`);
    },
    grid(seed) {
      const r = rng(seed); let g = "";
      for (let row = 0; row < 14; row++) for (let col = -10; col < 30; col++) {
        const z = 1 + row * .22, x = 320 + (col * 32 - 320) / z * 1.6, y = 420 - (row * 34) / (1 + row * .12);
        if (x < -10 || x > 650) continue;
        const hot = r() < .035;
        g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${((hot ? 7 : 3.2) / z).toFixed(2)}" fill="${hot ? "#ff5a4e" : "#2f4fd8"}" fill-opacity="${(1 - row / 15).toFixed(2)}"/>`;
      }
      return wrapSvg("#eef0f4", g);
    },
    bars(seed) {
      const r = rng(seed + 5); let g = "", line = "";
      for (let i = 0; i < 22; i++) {
        const h = 40 + r() * 230, x = 70 + i * 23, over = h > 215;
        g += `<rect x="${x}" y="${360 - h}" width="14" height="${h}" rx="2" fill="${over ? "#2f4fd8" : "#c7cdea"}"/>`;
      }
      line = `<line x1="50" y1="145" x2="590" y2="145" stroke="#ff5a4e" stroke-width="1.6" stroke-dasharray="6 6"/>`;
      return wrapSvg("#eff1f5", g + line + `<line x1="50" y1="360.5" x2="590" y2="360.5" stroke="#aab0c4"/>`);
    },
    map(seed) {
      const r = rng(seed + 7), hubs = [[150,150],[175,250],[310,140],[330,215],[460,170],[500,150],[520,240],[440,300]]; let g = "";
      hubs.forEach(([hx, hy]) => { const n = 10 + Math.floor(r() * 16);
        for (let i = 0; i < n; i++) { const a = r() * 6.28, d = r() * r() * 60;
          g += `<circle cx="${(hx + Math.cos(a) * d * 1.4).toFixed(1)}" cy="${(hy + Math.sin(a) * d).toFixed(1)}" r="${(1.5 + r() * r() * 9).toFixed(1)}" fill="#2f4fd8" fill-opacity="${(.25 + r() * .55).toFixed(2)}"/>`; } });
      let grid = "";
      for (let x = 40; x < 640; x += 40) grid += `<line x1="${x}" y1="0" x2="${x}" y2="420" stroke="#d5d9e4" stroke-width=".6"/>`;
      for (let y = 30; y < 420; y += 40) grid += `<line x1="0" y1="${y}" x2="640" y2="${y}" stroke="#d5d9e4" stroke-width=".6"/>`;
      return wrapSvg("#eef0f4", grid + g);
    },
    waves(seed) {
      let g = "";
      for (let k = 0; k < 18; k++) {
        let d = `M -20 ${120 + k * 12}`;
        for (let x = -20; x <= 660; x += 20) d += ` L ${x} ${(120 + k * 12 + Math.sin(x / 70 + k * .35) * (34 - k * 1.3) + Math.sin(x / 23 + k) * 4).toFixed(1)}`;
        g += `<path d="${d}" fill="none" stroke="#2f4fd8" stroke-opacity="${(.12 + k * .045).toFixed(2)}" stroke-width="1.4"/>`;
      }
      return wrapSvg("#eef0f4", g);
    },
    invader() {
      const m = ["00100000100","00010001000","00111111100","01101110110","11111111111","10111111101","10100000101","00011011000"];
      let g = ""; const px = 22, ox = 320 - 5.5 * px, oy = 120;
      m.forEach((row, y) => [...row].forEach((c, x) => { if (c === "1") g += `<rect x="${ox + x * px}" y="${oy + y * px}" width="${px - 2}" height="${px - 2}" fill="#2f4fd8"/>`; }));
      let stars = ""; const r = rng(42);
      for (let i = 0; i < 60; i++) stars += `<rect x="${(r() * 640).toFixed(0)}" y="${(r() * 420).toFixed(0)}" width="3" height="3" fill="#2f4fd8" fill-opacity="${(.15 + r() * .35).toFixed(2)}"/>`;
      return wrapSvg("#eceef4", stars + g + `<rect x="${320 - 22}" y="350" width="44" height="12" fill="#ff5a4e"/><rect x="${320 - 6}" y="338" width="12" height="12" fill="#ff5a4e"/><rect x="318" y="300" width="4" height="18" fill="#ff5a4e"/>`);
    },
  };
  const coverKeys = Object.keys(covers);
  const coverFor = (p, i) => p.image

  /* ---------- helpers ---------- */
  const hero = h => `<p class="kicker">${esc(t(h.kicker))}</p><h1>${esc(t(h.title))}</h1><p class="intro">${esc(t(h.intro))}</p>`;

  /* ---------- render everything ---------- */
  function render() {

  function renderProjects() {

  const visible = () => S.projects.filter(p => !p.hidden);
  function renderDetail(slug) {
    const list = visible(), i = list.findIndex(p => p.slug === slug), p = list[i];
    if (!p) return false;
    const sec = (label, html) => html ? `<div class="sec"><div class="lbl">${esc(label)}</div><div>${html}</div></div>` : "";
    const ul = arr => arr && arr.length ? `<ul>${arr.map(x => `<li>${esc(t(x))}</li>`).join("")}</ul>` : "";

    };

      ? `<div class="hero-media"><video controls playsinline preload="none" poster="${esc(p.video.poster || p.image || "")}" src="${esc(p.video.src)}"></video></div>`

  }

  /* ---------- events ---------- */
  /* ---------- contact: copy the address (mailto alone does nothing without a mail app) ---------- */
  let toastTimer;
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 3200); }
  async function copyEmail() {
    const mail = S.links.email; if (!mail) return;
    try { await navigator.clipboard.writeText(mail); }
    catch { const ta = document.createElement("textarea"); ta.value = mail; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch {} ta.remove(); }
    toast(`${u("copied")} ${mail}`);
  }
  document.addEventListener("click", e => {
    if (e.target.closest("[data-copy]")) { e.preventDefault(); copyEmail(); return; }
    if (e.target.closest("[data-mail]")) copyEmail(); // the mailto link still opens the mail app when there is one
  });
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang; store.set("lang", lang);
    const url = new URL(location.href);
    if (lang === "fr") url.searchParams.set("lang", "fr"); else url.searchParams.delete("lang");
    history.replaceState(null, "", url);
    render(); route(false);
  }));

  function route(scroll = true) {
    const page = (location.hash || "#projects").slice(1);
    let id = ["projects", "background", "links"].includes(page) ? page : "projects", proj = null;
    if (page.startsWith("p/")) { proj = renderDetail(page.slice(2)); if (proj) id = "project"; }
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "page-" + id));
    document.querySelectorAll(".nav a.tab").forEach(a => a.classList.toggle("on", a.dataset.page === (id === "project" ? "projects" : id)));
    $("crumb").innerHTML = id === "projects" ? `<b>${u("crumbProjects")}</b><span>${visible().length} ${u("projectsWord")}</span>`
      : id === "project" ? `<a href="#projects"><b>${u("crumbProjects")}</b></a><span>${esc(t(proj.title))}</span>`
      : `<b>${u(id === "background" ? "crumbBackground" : "crumbLinks")}</b>`;
    document.title = id === "project" ? `${t(proj.title)} — ${S.name}` : `${S.name} — Portfolio`;
    if (scroll) window.scrollTo({ top: 0 });
  }
  window.addEventListener("hashchange", () => route());

  /* ---------- theme ---------- */
  const saved = store.get("theme");
  if (saved) document.documentElement.dataset.theme = saved;
  $("theme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    store.set("theme", dark ? "light" : "dark");
  });

  render();
  route();
})();
</script>
</body>
</html>
